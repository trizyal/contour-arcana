<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Ensures proper scaling on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contour Arcana</title>
  </head>

  <!--
    Tailwind utility classes on <body>:
    - h-screen w-screen: fill the full browser window width and height
    - bg-zinc-900 text-zinc-100: dark charcoal background, light text
    - relative overflow-hidden: anchor floating panel without scrollbars
  -->
  <body class="relative m-0 h-screen w-screen overflow-hidden bg-zinc-900 font-sans text-zinc-100">
    <!-- Floating Expandable Settings Panel (starts collapsed over the canvas) -->
    <aside
      id="settings-panel"
      class="fixed top-4 left-4 z-20 flex max-h-[calc(100vh-2rem)] w-11 flex-col justify-between overflow-hidden rounded-2xl border border-zinc-750/80 bg-zinc-850/90 shadow-2xl backdrop-blur-md transition-all duration-200 select-none"
    >
      <div class="overflow-y-auto">
        <!-- Panel Header + Collapse Toggle -->
        <div class="flex items-center justify-between border-b border-zinc-750/80 px-3 py-2.5">
          <span
            id="panel-title"
            class="hidden text-xs font-semibold tracking-wider text-zinc-400 uppercase"
          >
            World Settings
          </span>
          <button
            id="toggle-panel-btn"
            type="button"
            title="Toggle Settings Panel"
            class="cursor-pointer rounded-md p-1 text-zinc-400 transition hover:bg-zinc-750 hover:text-zinc-100"
          >
            <svg
              id="toggle-icon"
              class="h-4 w-4 rotate-180 transition-transform duration-200"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                fill-rule="evenodd"
                d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
        </div>

        <!-- Expandable Controls Body -->
        <div id="panel-body" class="hidden flex-col gap-5 p-4">
          <!-- Primary Action -->
          <!-- `id="regen-btn"` is grabbed by main.ts to trigger `world.generate()` -->
          <button
            id="regen-btn"
            class="w-full cursor-pointer rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-500 active:bg-indigo-700"
          >
            New World
          </button>

          <!-- Terrain & Climate Group -->
          <div class="flex flex-col gap-3.5">
            <h2 class="text-[11px] font-semibold tracking-wider text-zinc-500 uppercase">
              Terrain &amp; Climate
            </h2>

            <!-- Map Resolution / Grid Size -->
            <label class="flex w-full items-center justify-between gap-3 text-xs text-zinc-300">
              <span class="shrink-0">Map Size</span>
              <select
                id="map-size-select"
                class="min-w-0 flex-1 cursor-pointer rounded border border-zinc-750 bg-zinc-900 px-2 py-1 font-mono text-xs text-zinc-200"
              >
                <option value="512">512 &times; 512</option>
                <option value="700" selected>700 &times; 700</option>
                <option value="1024">1024 &times; 1024</option>
                <option value="1400">1400 &times; 1400</option>
              </select>
            </label>

            <!-- Active: Sea Level -->
            <!-- Wrapping <input> inside <label> links the text to the slider -->
            <label class="flex w-full items-center justify-between gap-3 text-xs text-zinc-300">
              <span class="shrink-0">Sea Level</span>
              <!-- `id="sea-slider"` feeds values from 0.10 to 0.80 into `world.set_sea_level()` -->
              <input
                id="sea-slider"
                type="range"
                min="0.1"
                max="0.8"
                step="0.01"
                value="0.45"
                class="arcana-slider min-w-0 flex-1 cursor-pointer"
              />
              <span
                id="sea-value"
                class="w-11 shrink-0 rounded border border-zinc-750 bg-zinc-900 px-2 py-1 text-center font-mono text-xs text-zinc-200"
              >
                0.45
              </span>
            </label>

            <!-- Stub: Noise Frequency -->
            <label class="flex w-full items-center justify-between gap-3 text-xs text-zinc-300">
              <span class="shrink-0">Continent Scale</span>
              <input
                id="freq-slider"
                type="range"
                min="0.001"
                max="0.02"
                step="0.001"
                value="0.005"
                class="arcana-slider min-w-0 flex-1 cursor-pointer"
              />
              <span
                id="freq-value"
                class="w-11 shrink-0 rounded border border-zinc-750 bg-zinc-900 px-2 py-1 text-center font-mono text-xs text-zinc-400"
              >
                0.005
              </span>
            </label>

            <!-- Stub: Noise Octaves -->
            <label class="flex w-full items-center justify-between gap-3 text-xs text-zinc-300">
              <span class="shrink-0">Coastline Detail</span>
              <input
                id="octaves-slider"
                type="range"
                min="1"
                max="8"
                step="1"
                value="5"
                class="arcana-slider min-w-0 flex-1 cursor-pointer"
              />
              <span
                id="octaves-value"
                class="w-11 shrink-0 rounded border border-zinc-750 bg-zinc-900 px-2 py-1 text-center font-mono text-xs text-zinc-400"
              >
                5
              </span>
            </label>

            <!-- Stub: Island Falloff -->
            <label class="flex w-full items-center justify-between gap-3 text-xs text-zinc-300">
              <span class="shrink-0">Island Falloff</span>
              <input
                id="falloff-slider"
                type="range"
                min="0.0"
                max="2.0"
                step="0.05"
                value="1.0"
                class="arcana-slider min-w-0 flex-1 cursor-pointer"
              />
              <span
                id="falloff-value"
                class="w-11 shrink-0 rounded border border-zinc-750 bg-zinc-900 px-2 py-1 text-center font-mono text-xs text-zinc-400"
              >
                1.00
              </span>
            </label>
          </div>

          <hr class="border-zinc-750" />

          <!-- Sculpting Brush Group -->
          <div class="flex flex-col gap-3.5">
            <h2 class="text-[11px] font-semibold tracking-wider text-zinc-500 uppercase">
              Sculpt Brush
            </h2>

            <!-- Wired to main.ts brushRadius -->
            <label class="flex w-full items-center justify-between gap-3 text-xs text-zinc-300">
              <span class="shrink-0">Brush Radius</span>
              <input
                id="radius-slider"
                type="range"
                min="5"
                max="80"
                step="1"
                value="26"
                class="arcana-slider min-w-0 flex-1 cursor-pointer"
              />
              <span
                id="radius-value"
                class="w-11 shrink-0 rounded border border-zinc-750 bg-zinc-900 px-2 py-1 text-center font-mono text-xs text-zinc-400"
              >
                26px
              </span>
            </label>

            <!-- Wired to main.ts brushStrength -->
            <label class="flex w-full items-center justify-between gap-3 text-xs text-zinc-300">
              <span class="shrink-0">Brush Strength</span>
              <input
                id="strength-slider"
                type="range"
                min="0.01"
                max="0.15"
                step="0.01"
                value="0.03"
                class="arcana-slider min-w-0 flex-1 cursor-pointer"
              />
              <span
                id="strength-value"
                class="w-11 shrink-0 rounded border border-zinc-750 bg-zinc-900 px-2 py-1 text-center font-mono text-xs text-zinc-400"
              >
                0.03
              </span>
            </label>
          </div>
        </div>
      </div>

      <!-- Footer Hint -->
      <div
        id="panel-footer"
        class="hidden border-t border-zinc-750/80 px-4 py-3 text-[11px] text-zinc-400"
      >
        Drag: Raise Land &bull; Shift+Drag: Lower Sea
      </div>
    </aside>

    <!-- Main Viewport: holds the drawing surface across the full browser width/height -->
    <main class="h-full w-full">
      <!--
        `<canvas>` is a blank pixel grid.
        `width` and `height` are kept synced with `mapSize` in main.ts
        so the pixel buffer from Rust aligns 1:1 with the canvas.
      -->
      <canvas id="map-canvas" class="block h-full w-full cursor-crosshair"></canvas>
    </main>

    <!--
      Entry point for Vite. `type="module"` lets us use modern `import` statements.
      Vite automatically compiles TypeScript and bundles this when you run `npm run build`.
    -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
