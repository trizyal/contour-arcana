<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contour Arcana</title>
  </head>
  <body>
    <header class="toolbar">
      <button id="regen-btn">New World</button>
      <label>
        Sea Level
        <input
          id="sea-slider"
          type="range"
          min="0.1"
          max="0.8"
          step="0.01"
          value="0.45"
        />
      </label>
      <span class="hint">Drag: Raise Land | Shift+Drag: Lower Sea</span>
    </header>

    <main>
      <canvas id="map-canvas" width="700" height="700"></canvas>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
